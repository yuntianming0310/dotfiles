set-option -g allow-rename off
set-option -g automatic-rename off
set -g renumber-windows on

set -g focus-events on

# 开启 TrueColor、斜体与下划线波浪线（undercurl）透传，保证 Neovim 色彩与外部终端一致
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 3
bind -r h resize-pane -L 3

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind [ copy-mode -u

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

unbind -T copy-mode-vi MouseDragEnd1Pane

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux#v2.1.3' # Theme

# tmuxplugin-catppuccin
# ---------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
# v2.1.3 内置 rounded 在透明状态栏下会用 reverse 画出方块背景，改用 custom + bg=default 正常渲染圆角
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_number_color "#{@thm_overlay_1}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"

set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg=default]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@thm_overlay_1},bg=default]#[none]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_surface_1},bg=default]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_mauve},bg=default]#[none]"

set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_lavender}"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# ============================================= #

# post init catppuccin settings
# tmux 3.8 默认给当前窗口加 underscore 下划线，显式关闭以保持胶囊干净
set -g window-status-current-style "default"
set -g status-left ""
set -g status-right-length 100
set -g  status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

